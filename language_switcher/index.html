<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Language Switcher</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="js.js"></script>
</head>

<body>
    <div class="app">
        <nav class="topbar">
            <div class="brand">
                <span class="dot"></span>
                <span class="brand__name">Language Switcher</span>
            </div>

            <label class="picker">
                <span class="picker__label">Language</span>
                <select id="languageSwitcher" class="picker__select">
                    <option value="da">Dansk</option>
                    <option value="de">Deutsch</option>
                </select>
            </label>
        </nav>

        <main class="card">
            <h1 class="header">UDSKIFTES</h1>
            <p class="content">Content</p>
            <div class="divider"></div>
            <p class="footer">UDSKIFTES</p>
        </main>
    </div>
</body>

</html>
