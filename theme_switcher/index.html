<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Switcher</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>

<body data-theme="light">
    <header class="site-header">
        <div class="header-inner">
            <h1 class="logo">Theme Switcher</h1>

            <label class="theme-label" for="themeSelect">
                Vælg tema:
                <select id="themeSelect">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                    <option value="hawaii">Hawaii</option>
                </select>
            </label>
        </div>
    </header>

    <main class="site-main">
        <h2>Velkommen</h2>
        <p>
            Vælg et tema i dropdown-menuen. Det ret sejt.
        </p>

        <div class="card">
            <h3>Eksempel kort</h3>
            <p>Dette element ændrer også farver.</p>
            <button class="btn">En knap</button>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 Theme Switcher</p>
    </footer>
</body>

</html>
